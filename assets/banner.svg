<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="python-fde: daily Python and forward-deployed engineering practice, coached by email, remembered in git">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14233b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#4b8bbe"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="98" font-size="20" fill="#7d8ba3">&gt;&gt;&gt; import practice</text>
    <text x="72" y="168" font-size="68" font-weight="700" fill="#f4f6fb">python<tspan fill="#ffd43b">-</tspan>fde</text>
  </g>
  <rect x="72" y="190" width="150" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#b8c2d4">Daily Python and forward-deployed engineering practice. Coached by email, remembered in git.</text>

  <!-- review ladder: 1, 3, 7, 21 days -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" text-anchor="middle">
    <path d="M846 150H1098" stroke="#2c3e5c" stroke-width="2"/>
    <g fill="#14233b" stroke-width="2">
      <circle cx="846" cy="150" r="20" stroke="#ffd43b"/>
      <circle cx="930" cy="150" r="20" stroke="#c9c86a"/>
      <circle cx="1014" cy="150" r="20" stroke="#86ab95"/>
      <circle cx="1098" cy="150" r="20" stroke="#4b8bbe"/>
    </g>
    <g fill="#f4f6fb">
      <text x="846" y="155">1</text>
      <text x="930" y="155">3</text>
      <text x="1014" y="155">7</text>
      <text x="1098" y="155">21</text>
    </g>
    <text x="972" y="108" fill="#7d8ba3">days until the next review</text>
  </g>
</svg>
